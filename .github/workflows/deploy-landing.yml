name: Déployer la landing sur Vercel

# Déploie landing/ en production sur le projet Vercel « morning-paper ».
#
# Prérequis : un seul secret de dépôt, VERCEL_TOKEN
#   Vercel → Account Settings → Tokens → Create Token (scope : bubummmm's projects)
#   GitHub → Settings → Secrets and variables → Actions → New repository secret
#             Name: VERCEL_TOKEN    Secret: <le jeton>
#
# Ensuite : ce workflow part à chaque push sur landing/, ou à la demande
# (onglet Actions → « Déployer la landing sur Vercel » → Run workflow).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/landing-page-vercel-lc5dlg
      - main
    paths:
      - 'landing/**'
      - '.github/workflows/deploy-landing.yml'

concurrency:
  group: deploy-landing
  cancel-in-progress: true

jobs:
  deploy:
    name: Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: team_UiBCzWjmTg1C1V8XgcYUT8Bd
      VERCEL_PROJECT_ID: prj_vgDq63iVVtkXUpFw8SXqnBOYwhwe

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier que le jeton est présent
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Le secret VERCEL_TOKEN est absent. Crée-le dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Jeton présent."

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer la CLI Vercel
        run: npm install --global vercel@latest

      - name: Déployer en production
        id: deploy
        working-directory: landing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          # La CLI écrit sa progression sur stderr et l'URL sur stdout, mais on
          # ne parie pas là-dessus : on garde tout, on affiche tout, puis on
          # extrait la dernière URL vue. Une valeur multi-ligne dans
          # GITHUB_OUTPUT casserait l'étape.
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" > deploy.out 2> deploy.err || {
            echo "::error::Le déploiement Vercel a échoué."
            cat deploy.err
            exit 1
          }
          cat deploy.err
          cat deploy.out

          url=$(grep -Eo 'https://[a-zA-Z0-9._-]+\.vercel\.app' deploy.out | tail -1 || true)
          if [ -z "$url" ]; then
            echo "::error::Impossible de lire l'URL de déploiement dans la sortie de la CLI."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

          {
            echo "### Déployé"
            echo ""
            echo "- Déploiement : $url"
            echo "- Production : https://morning-paper-one.vercel.app"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier que la page répond
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          fail=0
          for path in / /styles.css /script.js /assets/journaux.webp /assets/logo.webp; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 4 --retry-delay 3 "$URL$path")
            echo "$code  $path"
            [ "$code" = "200" ] || fail=1
          done
          if [ "$fail" = "1" ]; then
            echo "::error::Au moins une ressource ne renvoie pas 200."
            exit 1
          fi
          echo "Toutes les ressources répondent 200."
