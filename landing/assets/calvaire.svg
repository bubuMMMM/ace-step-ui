<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Calvaire breton en granit">
  <defs>
    <linearGradient id="granit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8D4CC"/><stop offset=".45" stop-color="#A9A49A"/><stop offset="1" stop-color="#7A756C"/>
    </linearGradient>
    <linearGradient id="granit2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BFBAB1"/><stop offset="1" stop-color="#8A857C"/>
    </linearGradient>
    <clipPath id="kclip"><rect width="300" height="400"/></clipPath>
  </defs>
  <g clip-path="url(#kclip)">
    <rect width="300" height="400" fill="#F9C6D8"/>
    <circle cx="150" cy="168" r="118" fill="#FBD9E5" opacity=".9"/>
    <!-- base -->
    <path d="M56 372h188v28H56z" fill="url(#granit2)"/>
    <path d="M72 340h156v34H72z" fill="url(#granit)"/>
    <path d="M86 312h128v30H86z" fill="url(#granit2)"/>
    <g stroke="#6F6A62" stroke-width="2" opacity=".45">
      <path d="M120 340v34M178 340v34M106 312v30M160 312v30M100 372v28M156 372v28M212 372v28"/>
    </g>
    <!-- shaft -->
    <path d="M132 132h36v182h-36z" fill="url(#granit)"/>
    <path d="M132 132h12v182h-12z" fill="#E2DED6" opacity=".55"/>
    <!-- crossbar -->
    <path d="M74 118h152v30H74z" fill="url(#granit)"/>
    <path d="M74 118h152v8H74z" fill="#E2DED6" opacity=".5"/>
