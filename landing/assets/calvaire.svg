    <g stroke="#6F6A62" stroke-width="2.5" opacity=".5" fill="none">
      <path d="M138 230h24M138 250h24M138 270h24M138 290h24"/>
    </g>
    <!-- lichen -->
    <g fill="#A8B86A" opacity=".55">
      <circle cx="96" cy="352" r="9"/><circle cx="110" cy="358" r="5"/><circle cx="206" cy="330" r="7"/><circle cx="164" cy="200" r="5"/><circle cx="86" cy="128" r="4"/>
    </g>
    <!-- grass -->
    <path d="M0 386c26-10 52-10 78-2 24-8 48-8 72 0 26-10 52-10 78-2 24-8 48-8 72 2v16H0z" fill="#8FBF4F"/>
    <g stroke="#6EA33A" stroke-width="4" stroke-linecap="round">
      <path d="M34 388v-14M62 392v-12M212 388v-14M258 392v-12"/>
    </g>
