    <path d="M132 62h36v58h-36z" fill="url(#granit)"/>
    <circle cx="150" cy="56" r="18" fill="url(#granit2)"/>
    <!-- carved figures -->
    <g fill="#6F6A62" opacity=".7">
      <circle cx="150" cy="164" r="11"/><path d="M138 178h24v34h-24z"/>
      <circle cx="98" cy="132" r="8"/><path d="M89 142h18v22H89z"/>
      <circle cx="202" cy="132" r="8"/><path d="M193 142h18v22h-18z"/>
