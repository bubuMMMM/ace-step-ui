    <path d="M296 470 372 388l58 26 56-42 62 34 54-20 78 46 56-16v152H272z" fill="url(#rockA)"/>
    <path d="M372 388 430 414l-34 40-50-14zM540 406l54-20 36 24-48 30z" fill="#A69D8E" opacity=".5"/>
    <path d="M244 600c10-56 42-98 94-114l44 36 62-24 46 32 64-20 72 48 58-16 46 58z" fill="url(#rockB)"/>
    <path d="M372 528 434 504l34 28-48 28zM584 540l60-22 36 28-52 28z" fill="#7C7466" opacity=".38"/>
    <path d="M0 600c26-52 74-84 130-90l34 30 52-18 40 26v52z" fill="url(#rockB)" opacity=".92"/>

    <!-- foam -->
    <g fill="#EAF6FF" opacity=".85">
      <path d="M254 520c16-5 27 2 31 11 9-7 22-4 27 7-16 6-45 8-65 2 0-9 2-15 7-20z"/>
      <path d="M660 470c13-6 26-2 32 7 11-4 22 0 24 11-19 6-44 6-61-2 0-7 2-12 5-16z" opacity=".7"/>
      <path d="M424 468c11-4 20 0 24 9-11 6-26 6-35 2 2-7 7-10 11-11z" opacity=".6"/>
      <path d="M104 556c14-6 27-2 33 8 12-5 24 0 26 12-21 6-48 6-66-3 0-8 3-13 7-17z" opacity=".65"/>
    </g>

    <!-- keeper's house -->
    <path d="M336 448h80v50h-80z" fill="#F2F0EC"/>
    <path d="M328 448 376 410l48 38z" fill="#B23A2E"/>
    <path d="M350 464h20v20h-20z" fill="#2E4A63"/>
    <path d="M388 464h16v16h-16z" fill="#2E4A63" opacity=".85"/>
    <path d="M336 448h14v50h-14z" fill="#FFFFFF" opacity=".6"/>

    <!-- lighthouse -->
    <path d="M440 452 452 206h40l12 246z" fill="url(#tower)"/>
    <path d="M440 452 452 206h10l-7 246z" fill="#FFFFFF" opacity=".5"/>
    <path d="M492 206h-8l7 246h13z" fill="#8D959C" opacity=".42"/>
    <path d="M436 436h72v16h-72z" fill="#E3E6E9"/>
    <path d="M436 436h72v5h-72z" fill="#B9BFC5"/>
    <g fill="#243B52">
      <rect x="464" y="244" width="16" height="23" rx="8"/>
      <rect x="465" y="300" width="15" height="21" rx="7.5"/>
      <rect x="466" y="356" width="14" height="20" rx="7"/>
    </g>
    <!-- gallery -->
    <path d="M432 190h80v14h-80z" fill="#3A3F45"/>
    <path d="M430 184h84v7h-84z" fill="#585F66"/>
    <g stroke="#3A3F45" stroke-width="2.8">
      <path d="M440 164v20M452 164v20M464 164v20M476 164v20M488 164v20M500 164v20"/>
      <path d="M436 166h72" stroke-width="3.6"/>
    </g>
    <!-- lantern room -->
    <path d="M448 164v-34h48v34z" fill="#C0392B"/>
    <path d="M453 133h38v27h-38z" fill="#FFE9A8"/>
    <g stroke="#C0392B" stroke-width="2.8"><path d="M466 133v27M479 133v27"/></g>
    <path d="M442 130 472 104l30 26z" fill="#A5322A"/>
    <path d="M472 104 502 130h-14l-16-26z" fill="#8C2A23"/>
    <circle cx="472" cy="100" r="6" fill="#C0392B"/>
    <path d="M470 94h4V78h-4z" fill="#4A3F3B"/>

    <!-- light beams -->
    <path d="M456 148 236 74l-8 108 224-26z" fill="#FFF6D0" opacity=".22"/>
    <path d="M488 148l186-52 6 84-188-14z" fill="#FFF6D0" opacity=".18"/>

    <!-- birds -->
    <g stroke="#2B3B4A" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6">
      <path d="M126 274c6-7 11-7 16 0 5-7 10-7 16 0"/>
      <path d="M172 246c4-5 8-5 11 0 4-5 8-5 11 0"/>
      <path d="M652 292c5-6 9-6 13 0 4-6 9-6 13 0"/>
      <path d="M600 258c4-4 7-4 10 0 3-4 7-4 10 0"/>
