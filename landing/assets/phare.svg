<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="Phare breton sur les rochers face à la mer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E6FCF"/>
      <stop offset=".5" stop-color="#6DA9E6"/>
      <stop offset=".84" stop-color="#B7DBF3"/>
      <stop offset="1" stop-color="#E4EFE6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E86BE"/>
      <stop offset=".4" stop-color="#28699F"/>
      <stop offset="1" stop-color="#10456F"/>
    </linearGradient>
    <linearGradient id="rockA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#948C7E"/><stop offset="1" stop-color="#4C473F"/>
    </linearGradient>
    <linearGradient id="rockB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6F675B"/><stop offset="1" stop-color="#2F2C27"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C3C9CF"/><stop offset=".3" stop-color="#FFFFFF"/>
      <stop offset=".72" stop-color="#F1F3F5"/><stop offset="1" stop-color="#A8B0B7"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFF3C4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="760" height="600"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="760" height="600" fill="url(#sky)"/>
    <circle cx="176" cy="118" r="132" fill="url(#glow)"/>

    <!-- clouds -->
    <g fill="#FFFFFF">
      <path d="M86 92c-15 0-27 9-27 19s12 18 27 18h104c17 0 30-8 30-18s-13-19-30-19c-6-14-21-22-38-22-16 0-30 8-36 22z" opacity=".82"/>
      <path d="M470 54c-12 0-21 6-21 14s9 14 21 14h90c14 0 24-6 24-14s-10-14-24-14c-4-11-16-17-30-17-13 0-24 6-29 17z" opacity=".7"/>
      <path d="M596 208c-10 0-18 5-18 11s8 12 18 12h78c11 0 20-6 20-12s-9-11-20-11c-4-9-14-14-25-14-11 0-20 5-25 14z" opacity=".55"/>
      <path d="M36 236c-8 0-14 4-14 9s6 9 14 9h64c9 0 16-4 16-9s-7-9-16-9c-4-7-12-11-21-11-8 0-16 4-20 11z" opacity=".5"/>
      <path d="M262 172c-8 0-15 4-15 9s7 9 15 9h56c9 0 15-4 15-9s-6-9-15-9c-3-7-11-11-19-11-7 0-14 4-18 11z" opacity=".42"/>
    </g>

    <!-- distant headlands -->
    <path d="M0 340 66 320l52 12 60-18 54 14 62-10 58 12 66-16 74 14 96-10 132 8v34H0z" fill="#5B7E93" opacity=".5"/>
    <path d="M0 352 92 340l70 10 76-12 84 12 96-10 120 12 122-8v26H0z" fill="#4E6F86" opacity=".45"/>

    <!-- sea -->
    <rect y="352" width="760" height="248" fill="url(#sea)"/>
    <g stroke="#BFE0F2" stroke-linecap="round" fill="none" opacity=".5" stroke-width="4">
      <path d="M24 372h56M132 366h38M244 374h72M366 368h48M470 376h64M594 370h56M684 378h60"/>
      <path d="M46 402h80M176 396h44M296 406h90M424 398h56M540 408h58M652 400h72"/>
      <path d="M14 442h66M136 450h98M272 440h52M394 452h74M520 442h66M640 452h96"/>
      <path d="M60 496h110M232 504h74M346 494h62M462 506h108M614 496h124"/>
      <path d="M0 552h90M154 560h122M334 550h70M436 562h120M598 552h140"/>
    </g>

